<!-- Sport-Fit -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport-Fit | 啞鈴肌力與間歇訓練 (SF-00003)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>⚡ Sport-Fit</h1>
    <p>全方位啞鈴肌群鍛鍊 × 專注間歇訓練</p>
  </header>

  <!-- 主分頁導覽 -->
  <div class="nav-tabs">
    <button class="nav-tab-btn active" onclick="switchMainTab('tab-explain', this)">
      <span>📖 訓練肌群說明</span>
      <span class="tab-badge" id="selectedCountBadge">20 已選</span>
    </button>
    <button class="nav-tab-btn" onclick="switchMainTab('tab-workout', this)">
      <span>⏱️ 間歇訓練開始</span>
    </button>
  </div>

  <!-- 分頁 1: 訓練肌群說明 -->
  <div id="tab-explain" class="tab-content active">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterCategory('all', this)">全部 (20)</button>
      <button class="filter-btn" onclick="filterCategory('arms', this)">💪 手臂 (5)</button>
      <button class="filter-btn" onclick="filterCategory('shoulders', this)">🏋️ 肩膀 (5)</button>
      <button class="filter-btn" onclick="filterCategory('legs', this)">🦵 腿部 (5)</button>
      <button class="filter-btn" onclick="filterCategory('core', this)">🔥 腹部核心 (5)</button>
    </div>

    <div class="batch-selection-bar">
      <span style="font-size:0.9rem; color:var(--text-muted);">勾選想加入計時訓練的動作：</span>
      <div style="display:flex; gap:8px;">
        <button class="batch-btn" onclick="selectAll(true)">全選</button>
        <button class="batch-btn" onclick="selectAll(false)">全部取消</button>
      </div>
    </div>

    <div class="exercise-grid" id="exerciseGrid"></div>
  </div>

  <!-- 分頁 2: 間歇訓練開始 -->
  <div id="tab-workout" class="tab-content">
    <div class="workout-container">
      
      <!-- 控制面板 -->
      <div class="timer-control-card">
        <div class="timer-settings-row">
          <div class="setting-item">
            <label>動作秒數 (Work)</label>
            <input type="number" id="workTime" value="30" min="5" max="300">
          </div>
          <div class="setting-item">
            <label>休息秒數 (Rest)</label>
            <input type="number" id="restTime" value="15" min="0" max="180">
          </div>
          <div class="setting-item">
            <label>循環組數 (Sets)</label>
            <input type="number" id="setCount" value="3" min="1" max="10">
          </div>
        </div>

        <div id="statusPill" class="status-pill status-idle">準備開始</div>
        <div id="timerClock" class="timer-clock">00:30</div>
        <div id="progressInfo" class="progress-info">請選擇動作後點擊開始</div>

        <div class="btn-row">
          <button id="startBtn" class="action-btn btn-start" onclick="toggleTimer()">開始訓練</button>
          <button id="resetBtn" class="action-btn btn-reset" onclick="resetTimer()">重置</button>
        </div>
      </div>

      <!-- 專注單一動作展示區 -->
      <div class="focus-exercise-card" id="focusCard">
        <div id="focusBadge" class="focus-badge focus-badge-work">當前訓練動作</div>
        <div class="focus-svg-box" id="focusSvgContainer"></div>
        <div class="focus-title" id="focusTitle">尚未選擇動作</div>
        <div class="focus-muscle" id="focusMuscle">主要受力肌群：--</div>
        <div class="focus-desc" id="focusDesc">請回到「訓練肌群說明」分頁勾選您想練習的動作。</div>
      </div>

    </div>
  </div>

  <!-- 頁尾版本指紋 -->
  <footer>
    <div class="version-fingerprint">Fingerprint: SF-00003 | Build: 2026.09.01</div>
  </footer>

  <!-- 依功能拆分引入 JS -->
  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
